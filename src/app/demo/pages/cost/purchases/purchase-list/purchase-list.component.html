<div class="row mb-4">
  <div class="col-sm-6">
    <ol class="breadcrumb mb-0"><li class="breadcrumb-item active">Compras / Reposición</li></ol>
  </div>
  <div class="col-sm-6 text-sm-end">
    <button class="btn btn-primary" (click)="openAdd()"><i class="ti ti-plus"></i> Nueva Compra</button>
  </div>
</div>
<div class="card">
  <div class="card-body table-responsive">
    <table class="table table-hover table-sm align-middle mb-0">
      <thead class="table-light">
        <tr><th>Número</th><th>Fecha</th><th>Proveedor</th><th>Total</th></tr>
      </thead>
      <tbody>
        @for (row of purchases; track row.id) {
          <tr>
            <td>{{ row.numero }}</td>
            <td>{{ row.fecha | date:'dd/MM/yyyy' }}</td>
            <td>{{ row.proveedorNombre || '-' }}</td>
            <td class="fw-bold text-success">${{ (row.total || 0) | number:'1.2-2' }}</td>
          </tr>
        } @empty {
          <tr><td colspan="4" class="text-center py-4 text-muted">No hay compras. La compra incrementa activos circulantes.</td></tr>
        }
      </tbody>
    </table>
  </div>
</div>
