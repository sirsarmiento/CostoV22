<div class="row mb-4">
  <div class="col-sm-6">
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb mb-0">
        <li class="breadcrumb-item active">Proveedores</li>
      </ol>
    </nav>
  </div>
  <div class="col-sm-6 text-sm-end mt-2 mt-sm-0">
    <button class="btn btn-primary d-inline-flex align-items-center gap-2" (click)="openAdd()">
      <i class="ti ti-plus fs-5"></i> Nuevo Proveedor
    </button>
  </div>
</div>

<div class="card">
  <div class="card-body">
    <div class="row mb-3">
      <div class="col-md-4">
        <input class="form-control" placeholder="Buscar..." [(ngModel)]="searchTerm" (input)="onSearch()">
      </div>
    </div>
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0 table-sm">
        <thead class="table-light">
          <tr>
            <th>Proveedor</th>
            <th>RIF</th>
            <th>Contacto</th>
            <th>Teléfono</th>
            <th>Email</th>
            <th class="text-center">Acciones</th>
          </tr>
        </thead>
        <tbody>
          @for (row of filtered; track row.id) {
            <tr>
              <td class="fw-bold">{{ row.nombre }}</td>
              <td>{{ row.rif || '-' }}</td>
              <td>{{ row.contacto || '-' }}</td>
              <td>{{ row.telefono || '-' }}</td>
              <td>{{ row.email || '-' }}</td>
              <td class="text-center">
                <button class="btn btn-icon btn-light-primary" (click)="onEdit(row)" title="Editar">
                  <i class="ti ti-edit fs-5"></i>
                </button>
              </td>
            </tr>
          } @empty {
            <tr><td colspan="6" class="text-center py-4 text-muted">No hay proveedores registrados.</td></tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
